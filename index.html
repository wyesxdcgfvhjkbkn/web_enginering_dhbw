<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TD: Polymorph</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================
         🎮 HUD / USER INTERFACE
    ====================================== -->
    <div id="ui">

        <!-- ❤️ Lebenspunkte -->
        <div class="ui-box">
            ❤️ HP: <span id="hp">100</span>
        </div>

        <!-- 🎯 Aktuelle Runde -->
        <div class="ui-box">
            🎯 Runde: <span id="round">1</span>
        </div>

        <!-- 💰 Geld -->
        <div class="ui-box">
            💰 Geld: <span id="money">500</span>
        </div>

        <!-- 🔴 Rundenstart -->
        <button id="startWaveButton">START</button>

        <!-- 🛒 Shop -->
        <div class="shop-container">

            <div class="ui-box shop-button" id="shopButton">
                🛒 Shop
            </div>

            <div class="shop-panel hidden" id="shopPanel">

                <div class="shop-item" data-tower="cannon">
                    <img src="assets/MG.png" alt="Kanone">
                    <div class="shop-text">
                        <div>Kanone</div>
                        <div class="shop-price">💰 50</div>
                    </div>
                </div>

                <div class="shop-item" data-tower="rocket">
                    <img src="assets/Raketenturm.png" alt="Rakete">
                    <div class="shop-text">
                        <div>Rakete</div>
                        <div class="shop-price">💰 75</div>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <!-- 🎮 Spielwelt -->
    <canvas id="game"></canvas>

    <!-- 🎨 Credit -->
    <div id="credit">Assets by Kenney.nl</div>

    <!-- 📜 Scripts – Reihenfolge wichtig! -->
    <script src="js/assets.js"></script>
    <script src="js/towers.js"></script>
    <script src="js/enemies.js"></script>
    <script src="js/terrain.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/waveSystem.js"></script>
    <script src="js/placement.js"></script>
    <script src="js/game.js"></script>

</body>

</html>
